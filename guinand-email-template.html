<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Guinand Newsletter</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600&display=swap');
body, table, td, a {
    -ms-text-size-adjust: 100%;
    -webkit-text-size-adjust: 100%;
}
table, td {
    mso-table-lspace: 0pt;
    mso-table-rspace: 0pt;
}
img {
    -ms-interpolation-mode: bicubic;
}
body {
    margin: 0;
    padding: 0;
    width: 100% !important;
    height: 100% !important;
    font-family: 'Source Sans Pro', Arial, sans-serif;
    background-color: #ffffff;
}
a {
    color: #E56C0B;
}
.button {
    background-color: #E56C0B;
    color: #ffffff !important;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 4px;
    display: inline-block;
}
@media screen and (max-width: 600px) {
    .responsive-table {
        width: 100% !important;
    }
    .footer .column {
        display: block !important;
        width: 100% !important;
        text-align: center !important;
    }
}
</style>
</head>
<body style="margin:0;">
<center style="width:100%; table-layout:fixed; background-color:#ffffff;">
    <div style="max-width:600px; margin:0 auto;">
        <table class="responsive-table" role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
            <tr>
                <td style="background-color:#000000; padding:20px; text-align:center;">
                    <img src="https://via.placeholder.com/150x50/000000/FFFFFF?text=Guinand" alt="Guinand Logo" width="150" style="display:block; border:0;" />
                </td>
            </tr>
            <tr>
                <td style="padding:20px;">
                    <h1 style="font-size:24px; font-weight:600; margin:0 0 16px;">Titel Ihres Newsletters</h1>
                    <p style="margin:0 0 16px;">Willkommen bei Guinand. Dies ist ein Beispiel für ein responsives HTML E-Mail Template.</p>
                    <p style="margin:0 0 24px;"><a href="#" class="button">Mehr erfahren</a></p>
                    <p style="margin:0;">Weitere Inhalte können hier platziert werden.</p>
                </td>
            </tr>
            <tr>
                <td class="footer" style="background-color:#333333; color:#ffffff; padding:20px;">
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                        <tr>
                            <td class="column" width="50%" style="padding:10px; font-size:14px; line-height:20px;">
                                <strong>Guinand GmbH</strong><br />
                                Musterstraße 1<br />
                                12345 Musterstadt
                            </td>
                            <td class="column" width="50%" style="padding:10px; font-size:14px; line-height:20px;">
                                Telefon: +49 123 456789<br />
                                <a href="mailto:info@guinand.com" style="color:#ffffff; text-decoration:none;">info@guinand.com</a><br />
                                <a href="https://www.guinand.com" style="color:#ffffff; text-decoration:none;">www.guinand.com</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</center>
</body>
</html>
